<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WE Router Dashboard</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Cairo,Arial,sans-serif;
    background:#08080b;
    color:#fff;
}

:root{
    --purple:#7b2cff;
    --purple2:#a45cff;
    --card:#15151b;
    --border:#292932;
    --muted:#aaa;
}

.container{
    width:min(1050px,94%);
    margin:auto;
    padding:18px 0 40px;
}

header{
    background:linear-gradient(135deg,#0d0d12,#211034);
    border:1px solid #2e1b47;
    border-radius:24px;
    padding:22px;
    margin-bottom:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:58px;
    height:58px;
    border-radius:17px;
    background:linear-gradient(135deg,var(--purple),#4a00c8);
    display:grid;
    place-items:center;
    font-size:25px;
    font-weight:800;
    box-shadow:0 10px 30px #7b2cff55;
}

h1{
    font-size:22px;
    margin:0;
}

header p{
    margin:3px 0 0;
    color:#bbb;
    font-size:13px;
}

/* الراوتر */

.router{
    height:110px;
    background:linear-gradient(180deg,#eeeeee,#bfc1c8);
    border-radius:25px;
    margin:70px auto 10px;
    position:relative;
    box-shadow:0 15px 35px #0008;
    max-width:650px;
}

.router::before,
.router::after{
    content:"";
    position:absolute;
    width:13px;
    height:90px;
    background:#777;
    border-radius:8px;
    top:-54px;
}

.router::before{
    right:18%;
}

.router::after{
    left:18%;
}

.router .lights{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
}

.light{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#6f2cff;
    box-shadow:0 0 12px #7b2cff;
}

.router .name{
    position:absolute;
    right:28px;
    top:35px;
    color:#333;
    font-weight:800;
}

/* الإحصائيات */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:15px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
}

.stat small{
    color:var(--muted);
    display:block;
    font-size:12px;
}

.stat strong{
    font-size:25px;
    display:block;
    margin-top:4px;
}

.purple{
    color:#a45cff;
}

/* الباقة */

.progressCard{
    margin-bottom:15px;
}

.progressTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.bar{
    height:13px;
    background:#292932;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#6d18ff,#b06cff);
    border-radius:20px;
    transition:.3s;
}

/* الأجهزة */

.sectionTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.sectionTitle h2{
    font-size:18px;
    margin:0;
}

button{
    border:0;
    border-radius:12px;
    padding:10px 15px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,var(--purple),#4d0fc9);
}

button:active{
    transform:scale(.96);
}

button.secondary{
    background:#24242c;
}

button.danger{
    background:#4b1820;
    color:#ffb7bf;
}

.devices{
    display:grid;
    gap:10px;
}

.device{
    display:flex;
    align-items:center;
    gap:13px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:13px;
}

.icon{
    width:43px;
    height:43px;
    border-radius:13px;
    background:#261343;
    display:grid;
    place-items:center;
    font-size:20px;
    flex-shrink:0;
}

.deviceInfo{
    flex:1;
    min-width:0;
}

.deviceInfo b{
    display:block;
    font-size:14px;
    word-break:break-word;
}

.deviceInfo span{
    font-size:11px;
    color:#999;
}

.used{
    text-align:left;
    min-width:75px;
}

.used b{
    display:block;
    color:#b16bff;
}

.used span{
    font-size:10px;
    color:#888;
}

.actions{
    display:flex;
    gap:6px;
}

.actions button{
    padding:8px 10px;
    font-size:12px;
}

.empty{
    text-align:center;
    color:#888;
    padding:30px;
}

/* النوافذ */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000c;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(450px,100%);
    background:#15151b;
    border:1px solid #38204f;
    border-radius:22px;
    padding:20px;
}

.modalBox h3{
    margin-top:0;
}

label{
    display:block;
    color:#bbb;
    font-size:12px;
    margin:10px 0 5px;
}

input{
    width:100%;
    padding:12px;
    border-radius:11px;
    border:1px solid #34343e;
    background:#0d0d11;
    color:white;
    font-family:inherit;
    outline:none;
    font-size:16px;
}

input:focus{
    border-color:#7b2cff;
}

.modalActions{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.modalActions button{
    flex:1;
}

/* شاشة كلمة المرور */

.passwordBox{
    width:min(380px,100%);
    background:#15151b;
    border:1px solid #38204f;
    border-radius:25px;
    padding:22px;
    text-align:center;
    box-shadow:0 20px 60px #000;
}

.passwordBox h3{
    margin:0;
    font-size:20px;
}

.passwordBox p{
    color:#999;
    font-size:12px;
    margin:7px 0 15px;
}

.passwordDots{
    height:45px;
    display:flex;
    justify-content:center;
    align-items:center;
    direction:ltr;
    font-size:25px;
    letter-spacing:7px;
    color:#a45cff;
}

.passwordError{
    color:#ff6565;
    font-size:12px;
    min-height:20px;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.keypad button{
    height:55px;
    border-radius:15px;
    font-size:20px;
    background:#24242c;
    border:1px solid #34343e;
}

.keypad button:active{
    background:#7b2cff;
}

.keypad .clear{
    font-size:13px;
    background:#352020;
    color:#ff9c9c;
}

.keypad .back{
    font-size:22px;
    background:#252038;
}

.cancelPassword{
    width:100%;
    margin-top:12px;
    background:#292930;
}

footer{
    text-align:center;
    color:#666;
    font-size:11px;
    margin-top:20px;
}

.loading{
    text-align:center;
    padding:25px;
    color:#999;
}

.errorBox{
    background:#35151a;
    border:1px solid #68252d;
    color:#ffb8be;
    border-radius:15px;
    padding:15px;
    line-height:1.8;
    font-size:13px;
}

@media(max-width:650px){

    .stats{
        grid-template-columns:1fr;
    }

    .router{
        height:90px;
    }

    .router::before,
    .router::after{
        height:65px;
        top:-42px;
    }

    .device{
        flex-wrap:wrap;
    }

    .used{
        margin-right:auto;
    }

    .actions{
        width:100%;
    }

    .actions button{
        flex:1;
    }

    .sectionTitle{
        align-items:flex-start;
    }

}

</style>

</head>


<body>

<div class="container">

<header>

    <div class="brand">

        <div class="logo">

        </div>

        <div>

            <h1>

            </h1>

            <p>
                نظام تجريبي لإدارة استهلاك الإنترنت
            </p>

        </div>

    </div>


    <div class="router">

        <div class="name">
            HOME ROUTER
        </div>

        <div class="lights">

            <i class="light"></i>
            <i class="light"></i>
            <i class="light"></i>
            <i class="light"></i>

        </div>

<!-- الإحصائيات -->

<div class="stats">

    <div class="card stat">

        <small>
            إجمالي الباقة
        </small>

        <strong>
            250 GB
        </strong>

    </div>


    <div class="card stat">

</div>


<!-- نسبة الاستهلاك -->

<!-- قائمة الأجهزة -->

<div class="card">

</div>


<footer>
    البيانات محفوظة على Firebase وتظهر على جميع الأجهزة
</footer>

</div>


<!-- ==================================================
     نافذة إضافة / تعديل جهاز
================================================== -->

<div
    class="modal"
    id="modal">

    <div class="modalBox">

        <h3 id="modalTitle">
            إضافة جهاز
        </h3>


        <label>
            اسم الجهاز
        </label>

        <input
            id="deviceName"
            placeholder="مثال: Redmi 12C"

        <label>
            الاستهلاك بالجيجابايت
        </label>

        <input
            id="deviceUsage"

            step="0.1"

</div>


<!-- ==================================================
     شاشة كلمة المرور
================================================== -->

<div
    class="modal"
    id="passwordModal">

    <div class="passwordBox">

        <h3>
            🔐 تأكيد العملية
        </h3>

        <p>
            أدخل كلمة المرور للمتابعة
        </p>


        <div
            class="passwordDots"

            <button onclick="pressKey('2')">2</button>

            <button onclick="pressKey('5')">5</button>
            <button onclick="pressKey('6')">6</button>

            <button onclick="pressKey('7')">7</button>
            <button onclick="pressKey('8')">8</button>
            <button onclick="pressKey('9')">9</button>

            <button
                class="clear"
                onclick="clearPassword()">

                مسح

            </button>

            <button onclick="pressKey('0')">
                0
            </button>

            <button
                class="back"
                onclick="backspace()">

                ⌫

            </button>

        </div>


        <button
            class="cancelPassword"
            onclick="closePassword()">

            إلغاء

        </button>

    </div>

</div>


<script type="module">

/* ==================================================
   FIREBASE
================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getDatabase,
    ref,
    get,
    set,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ==================================================
   بيانات Firebase الخاصة بك
================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyALknAXGEt4k_5c26WUYT2-tE00lwG6CMc",

    authDomain:
        "my-we-7be7c.firebaseapp.com",

    databaseURL:
        "https://my-we-7be7c-default-rtdb.firebaseio.com",

    projectId:
        "my-we-7be7c",

    storageBucket:
        "my-we-7be7c.firebasestorage.app",

    messagingSenderId:
        "286975925668",

    appId:
        "1:286975925668:web:cb30205ff611ead38f7531"

};


/* تشغيل Firebase */

const app =
    initializeApp(
        firebaseConfig
    );


const database =
    getDatabase(app);


/*
   البيانات كلها ستكون داخل:
   router/devices
*/

const devicesRef =
    ref(
        database,
        "router/devices"
    );


/* ==================================================
   إعدادات النظام
================================================== */

const ADMIN_PASSWORD = "2009";

const TOTAL_PACKAGE = 250;


/* ==================================================
   الأجهزة الأساسية المطلوبة
================================================== */

const defaultDevices = [

    {
        id: "redmi12c",
        name: "Redmi 12C",
        usage: 18,
        icon: "📱"
    },

    {
        id: "realme6i",
        name: "Realme 6i",
        usage: 24,
        icon: "📱"
    },

    {
        id: "oppoa15",
        name: "OPPO A15",
        usage: 15,
        icon: "📱"
    },

    {
        id: "redmi155g",
        name: "Redmi 15 5G",
        usage: 32,
        icon: "📱"
    },

    {
        id: "compaq",
        name: "Compaq Laptop",
        usage: 41,
        icon: "💻"
    },

    {
        id: "lenovo",
        name: "Lenovo Tablet",
        usage: 20,
        icon: "📱"
    },

    {
        id: "redmi5",
        name: "Redmi 5",
        usage: 12,
        icon: "📱"
    }

];


/* ==================================================
   متغيرات
================================================== */

let devices = [];

let editing = null;

let passwordInput = "";

let pendingAction = null;

let pendingId = null;


/* ==================================================
   تحميل البيانات من Firebase
================================================== */

/*
   مهم جدًا:

   لا نستخدم set() مباشرة عند فتح الموقع.

   أولًا نقرأ Firebase.

   لو البيانات موجودة:
       نستخدمها كما هي.

   لو Firebase فاضي لأول مرة:
       نضع الأجهزة الأساسية مرة واحدة فقط.

   بهذا الشكل Refresh / Restart
   لن يحذف الأجهزة ولن يرجعها للقيم القديمة.
*/

async function loadInitialData(){

    try{

        const snapshot =
            await get(
                devicesRef
            );


        if(
            snapshot.exists()
        ){

            const data =
                snapshot.val();


            devices =
                normalizeData(
                    data
                );


            render();

            return;

        }


        /*
           قاعدة البيانات فاضية تمامًا.
           هنا فقط نضيف الأجهزة الأساسية.
        */

        devices =
            [...defaultDevices];


        await set(
            devicesRef,
            devices
        );


        render();

    }

    catch(error){

        console.error(
            "Firebase error:",
            error
        );


        showFirebaseError(
            error
        );

    }

}


/* ==================================================
   متابعة Firebase لحظيًا
================================================== */

/*
   أي تغيير يحصل من موبايل أو جهاز آخر
   سيظهر هنا تلقائيًا.
*/

onValue(

    devicesRef,

    (snapshot) => {

        /*
           لو البيانات غير موجودة،
           لا نعمل Reset.

           loadInitialData()
           هي المسؤولة عن أول إنشاء فقط.
        */

        if(
            !snapshot.exists()
        ){

            return;

        }


        const data =
            snapshot.val();


        devices =
            normalizeData(
                data
            );


        render();

    },

    (error) => {

        console.error(
            error
        );

    }

);


/* ==================================================
   تحويل بيانات Firebase إلى Array
================================================== */

function normalizeData(data){

    if(
        Array.isArray(data)
    ){

        return data.filter(
            item =>
                item &&
                item.id !== undefined
        );

    }


    if(
        data &&
        typeof data === "object"
    ){

        return Object.values(
            data
        );

    }


    return [];

}


/* ==================================================
   حفظ البيانات
================================================== */

async function saveData(){

    try{

        /*
           نحفظ النسخة الحالية فقط.
           لا توجد أي عملية Reset.
        */

        await set(
            devicesRef,
            devices
        );

    }

    catch(error){

        console.error(
            error
        );

        alert(
            "لم يتم حفظ التعديل. تأكد من اتصال الإنترنت وFirebase."
        );

    }

}


/* ==================================================
   عرض البيانات
================================================== */

function render(){

    let used =
        devices.reduce(

            (sum,device) => {

                return sum +
                    Number(
                        device.usage || 0
                    );

            },

            0

        );


    const remaining =
        Math.max(
            TOTAL_PACKAGE - used,
            0
        );


    const percent =
        Math.min(
            (used / TOTAL_PACKAGE) * 100,
            100
        );


    document
    .getElementById("used")
    .textContent =
        formatNumber(
            used
        ) +
        " GB";


    document
    .getElementById("remaining")
    .textContent =
        formatNumber(
            remaining
        ) +
        " GB";


    document
    .getElementById("percent")
    .textContent =
        Math.round(
            percent
        ) +
        "%";


    document
    .getElementById("fill")
    .style.width =
        percent +
        "%";


    const box =
        document
        .getElementById("devices");


    if(
        devices.length === 0
    ){

        box.innerHTML = `

            <div class="empty">
                لا توجد أجهزة حاليًا
            </div>

        `;

        return;

    }


    box.innerHTML =

        devices
        .map(
            device => `

            <div class="device">

                <div class="icon">
                    ${device.icon || "📱"}
                </div>


                <div class="deviceInfo">

                    <b>
                        ${escapeHTML(
                            device.name
                        )}
                    </b>

                    <span>
                        استهلاك الجهاز
                    </span>

                </div>


                <div class="used">

                    <b>
                        ${formatNumber(
                            device.usage
                        )}
                        GB
                    </b>

                    <span>
                        مستخدم
                    </span>

                </div>


                <div class="actions">

                    <button
                        class="secondary"
                        onclick="
                            editDevice(
                                '${String(
                                    device.id
                                ).replace(
                                    /'/g,
                                    "\\'"
                                )}'
                            )
                        ">

                        تعديل

                    </button>


                    <button
                        class="danger"
                        onclick="
                            removeDevice(
                                '${String(
                                    device.id
                                ).replace(
                                    /'/g,
                                    "\\'"
                                )}'
                            )
                        ">

                        حذف

                    </button>

                </div>

            </div>

        `
        )
        .join("");

}


/* ==================================================
   تنسيق الأرقام
================================================== */

function formatNumber(number){

    return Number(number)
    .toLocaleString(
        "ar-EG",
        {
            maximumFractionDigits:1
        }
    );

}


/* ==================================================
   حماية النص
================================================== */

function escapeHTML(text){

    return String(text)
    .replace(
        /[&<>"']/g,
        function(match){

            const chars = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            };

            return chars[match];

        }
    );

}


/* ==================================================
   طلب إضافة جهاز
================================================== */

window.openAdd =
function(){

    askPassword(
        "add"
    );

};


/* ==================================================
   فتح نموذج الإضافة
================================================== */

function openAddForm(){

    editing = null;


    document
    .getElementById("modalTitle")
    .textContent =
        "إضافة جهاز";


    document
    .getElementById("deviceName")
    .value = "";


    document
    .getElementById("deviceUsage")
    .value = "";


    document
    .getElementById("modal")
    .classList.add(
        "show"
    );

}


/* ==================================================
   تعديل
================================================== */

window.editDevice =
function(id){

    askPassword(
        "edit",
        id
    );

};


/* ==================================================
   فتح نموذج التعديل
================================================== */

function openEditForm(id){

    const device =
        devices.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!device){

        alert(
            "الجهاز غير موجود"
        );

        return;

    }


    editing =
        id;


    document
    .getElementById("modalTitle")
    .textContent =
        "تعديل الجهاز";


    document
    .getElementById("deviceName")
    .value =
        device.name;


    document
    .getElementById("deviceUsage")
    .value =
        device.usage;


    document
    .getElementById("modal")
    .classList.add(
        "show"
    );

}


/* ==================================================
   حذف
================================================== */

window.removeDevice =
function(id){

    askPassword(
        "delete",
        id
    );

};


/* ==================================================
   تنفيذ الحذف
================================================== */

async function deleteDevice(id){

    const exists =
        devices.some(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!exists){

        return;

    }


    devices =
        devices.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    await saveData();

}


/* ==================================================
   حفظ الإضافة أو التعديل
================================================== */

window.saveDevice =
async function(){

    const name =
        document
        .getElementById("deviceName")
        .value
        .trim();


    const usage =
        Number(
            document
            .getElementById("deviceUsage")
            .value
        );


    if(
        !name ||
        Number.isNaN(usage) ||
        usage < 0
    ){

        alert(
            "من فضلك أدخل اسم الجهاز والاستهلاك بشكل صحيح."
        );

        return;

    }


    /* تعديل */

    if(
        editing !== null
    ){

        const device =
            devices.find(
                item =>
                    String(item.id) ===
                    String(editing)
            );


        if(device){

            device.name =
                name;

            device.usage =
                usage;

            device.icon =
                getDeviceIcon(
                    name
                );

        }

    }


    /* إضافة */

    else{

        devices.push({

            id:
                "device_" +
                Date.now(),

            name:
                name,

            usage:
                usage,

            icon:
                getDeviceIcon(
                    name
                )

        });

    }


    closeModal();


    await saveData();

};


/* ==================================================
   أيقونة الجهاز
================================================== */

function getDeviceIcon(name){

    const n =
        name.toLowerCase();


    if(
        n.includes("laptop") ||
        n.includes("compaq") ||
        n.includes("لاب")
    ){

        return "💻";

    }


    if(
        n.includes("tablet") ||
        n.includes("تابلت") ||
        n.includes("lenovo")
    ){

        return "📱";

    }


    return "📱";

}


/* ==================================================
   إغلاق نموذج الجهاز
================================================== */

window.closeModal =
function(){

    document
    .getElementById("modal")
    .classList.remove(
        "show"
    );

};


/* ==================================================
   كلمة المرور
================================================== */

function askPassword(
    action,
    id = null
){

    pendingAction =
        action;

    pendingId =
        id;

    passwordInput =
        "";


    document
    .getElementById("passwordError")
    .textContent =
        "";


    updatePasswordDots();


    document
    .getElementById("passwordModal")
    .classList.add(
        "show"
    );

}


/* ==================================================
   ضغط رقم
================================================== */

window.pressKey =
function(number){

    if(
        passwordInput.length >= 4
    ){

        return;

    }


    passwordInput +=
        number;


    updatePasswordDots();


    if(
        passwordInput.length === 4
    ){

        setTimeout(
            checkPassword,
            150
        );

    }

};


/* ==================================================
   عرض الباسورد
================================================== */

function updatePasswordDots(){

    let result = "";


    for(
        let i=0;
        i<4;
        i++
    ){

        result +=
            i < passwordInput.length
            ? "● "
            : "○ ";

    }


    document
    .getElementById("passwordDots")
    .textContent =
        result;

}


/* ==================================================
   حذف آخر رقم
================================================== */

window.backspace =
function(){

    passwordInput =
        passwordInput.slice(
            0,
            -1
        );


    document
    .getElementById("passwordError")
    .textContent =
        "";


    updatePasswordDots();

};


/* ==================================================
   مسح الباسورد
================================================== */

window.clearPassword =
function(){

    passwordInput =
        "";


    document
    .getElementById("passwordError")
    .textContent =
        "";


    updatePasswordDots();

};


/* ==================================================
   فحص كلمة المرور
================================================== */

function checkPassword(){

    if(
        passwordInput ===
        ADMIN_PASSWORD
    ){

        closePassword();

        executePendingAction();

    }

    else{

        document
        .getElementById("passwordError")
        .textContent =
            "❌ كلمة المرور غير صحيحة";


        passwordInput =
            "";


        updatePasswordDots();

    }

}


/* ==================================================
   تنفيذ العملية
================================================== */

function executePendingAction(){

    if(
        pendingAction ===
        "add"
    ){

        openAddForm();

    }


    else if(
        pendingAction ===
        "edit"
    ){

        openEditForm(
            pendingId
        );

    }


    else if(
        pendingAction ===
        "delete"
    ){

        deleteDevice(
            pendingId
        );

    }


    pendingAction =
        null;

    pendingId =
        null;

}


/* ==================================================
   إغلاق شاشة الباسورد
================================================== */

window.closePassword =
function(){

    document
    .getElementById("passwordModal")
    .classList.remove(
        "show"
    );


    passwordInput =
        "";


    pendingAction =
        null;

    pendingId =
        null;


    updatePasswordDots();

};
